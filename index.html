<!doctype html>
<html lang="zh-Hant">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet" type="text/css">
<title>flex</title>
</head>

<body>
<section>
    <h1>MEMORIES</h1>

    <!-- 上傳按鈕 -->
    <div class="toolbar">
        <label class="upload-btn">
            ＋ 上傳照片
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
        </label>
    </div>

    <!-- 照片牆：原本的卡片 + 上傳的卡片都放這裡 -->
    <div class="gallery" id="gallery">
        <article><a href="https://ex1-blond.vercel.app/"><img src="images/ff12.jpg" alt="圖片一"><p>回憶像一陣風</p></a></article>
        <article><a href="https://ex1-blond.vercel.app/"><img src="images/f2.jpg" alt="圖片二"><p>2回憶像一陣風</p></a></article>
        <article><a href="https://ex1-blond.vercel.app/"><img src="images/f3.jpg" alt="圖片三"><p>3回憶像一陣風</p></a></article>
        <article><a href="https://ex1-blond.vercel.app/"><img src="images/f4.jpg" alt="圖片四"><p>4回憶像一陣風</p></a></article>
        <article><a href="https://ex1-blond.vercel.app/"><img src="images/f5.jpg" alt="圖片五"><p>5回憶像一陣風</p></a></article>
    </div>
</section>

<script>
/* ---------- IndexedDB：把上傳的照片存在這個瀏覽器 ---------- */
const DB_NAME = 'memories';
const STORE = 'photos';

function openDB() {
    return new Promise((resolve, reject) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () =>
            r.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
    });
}
const wrap = req => new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
});
const store = (db, mode) => db.transaction(STORE, mode).objectStore(STORE);

/* ---------- 建立卡片 ---------- */
const gallery = document.getElementById('gallery');

function addCard(photo) {
    const card = document.createElement('article');
    card.dataset.id = photo.id;

    const wrapper = document.createElement('div');
    wrapper.className = 'card-body';

    const img = document.createElement('img');
    img.src = URL.createObjectURL(photo.blob);
    img.alt = photo.name;

    const p = document.createElement('p');
    p.textContent = photo.name;

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.type = 'button';
    del.textContent = '✕';
    del.title = '刪除這張照片';
    del.addEventListener('click', async () => {
        if (!confirm('要刪除這張照片嗎？')) return;
        const db = await openDB();
        await wrap(store(db, 'readwrite').delete(photo.id));
        URL.revokeObjectURL(img.src);
        card.remove();
    });

    wrapper.append(img, p);
    card.append(wrapper, del);
    gallery.append(card);
}

/* ---------- 上傳 ---------- */
document.getElementById('fileInput').addEventListener('change', async (e) => {
    const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
    if (!files.length) return;

    const db = await openDB();
    for (const file of files) {
        const photo = {
            name: file.name.replace(/\.[^.]+$/, ''), // 去掉副檔名當說明文字
            blob: file,
            time: Date.now()
        };
        photo.id = await wrap(store(db, 'readwrite').add(photo));
        addCard(photo);
    }
    e.target.value = ''; // 讓同一張圖可以再選一次
});

/* ---------- 載入之前上傳過的照片 ---------- */
(async () => {
    const db = await openDB();
    const photos = await wrap(store(db, 'readonly').getAll());
    photos.sort((a, b) => a.time - b.time).forEach(addCard);
})();
</script>
</body>
</html>
